name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # PRs: cancel stale builds, only the tip matters.
    # Main: let the running push finish, drop superseded queued runs,
    # so latest always lands on the newest finished build.
    concurrency:
      group: hermes-mobile-container
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w apps/desktop

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_BRANCH=${{ github.ref_name }}

      - name: Smoke test the candidate
        run: tests/container/smoke.sh "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"

      - name: Push the tested candidate
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_BRANCH=${{ github.ref_name }}

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
            echo "- Rollback: \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
