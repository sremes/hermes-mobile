# Hermes Mobile (PWA) — SWAG/nginx reverse-proxy site config
#
# Deploy target: hermes-mobile.example.lan (LAN/WG only, same as the dashboard).
#
# WHY THIS SHAPE:
# The PWA's auth model REQUIRES same-origin access to the gateway: the login
# page sets a host-only session cookie, and the app must call /api/* with that
# cookie on ITS OWN origin. So this block serves the built app AND proxies the
# gateway's API paths under the same domain. The app's Remote URL in Settings
# must be https://hermes-mobile.example.lan — never the gateway's own URL.
#
# Steps:
#   1. Build:  cd apps/desktop && npm run build
#   2. Ship:   scp -r dist <swag-host>:/config/www/hermes-mobile/
#   3. Install: copy this file to /config/nginx/site-confs/hermes-mobile.conf
#      (SWAG reloads nginx automatically on site-confs changes)
#   4. DNS:    hermes-mobile.example.lan -> SWAG host (same as the dashboard)
#   5. Cert:   covered by the existing wildcard cert in ssl.conf; if the cert
#      is per-name, add the name to the SWAG umbrella config first.
#   6. Phone:  Settings -> Gateway -> Remote URL https://hermes-mobile.example.lan

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hermes-mobile.example.lan;

    include /config/nginx/ssl.conf;

    # Attachments are uploaded as base64 JSON — no size limit.
    client_max_body_size 0;

    # Restrict to your LAN subnet so it's not WAN accessible
    allow 192.168.0.0/16;
    deny all;

    root /config/www/hermes-mobile;
    index index.html;

    # SPA shell — the app uses hash routing, so / is the only real path.
    # The shell must always revalidate; hashed assets below are immutable.
    # The guard turns a missing dist/ (index.html absent) into a readable
    # 503 instead of nginx's cryptic 500 "internal redirection cycle".
    location / {
        if (!-f $document_root/index.html) {
            return 503;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets — safe to cache forever (new deploys get new names).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker must never be cached (version bump = update signal).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Gateway: REST + the live WebSocket session channel (/api/ws?ticket=).
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.89.100;
        set $upstream_port 9119;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # WebSocket upgrade — without these the app connects but the live
        # session never opens (the HTTP probe passes, WS fails).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Login page + form POST (password-login sets the session cookie).
    location /auth/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.89.100;
        set $upstream_port 9119;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location = /login {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.89.100;
        set $upstream_port 9119;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Login page fonts.
    location /fonts/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.89.100;
        set $upstream_port 9119;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
